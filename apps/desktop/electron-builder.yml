# Packaging (docs/BRAINSTORM.md §10; docs/adr/0021-packaging-and-auto-update.md). Built by `pnpm dist` /
# `pnpm dist:linux` locally and by .github/workflows/release.yml on a `v*` tag.
appId: dev.sukun.matane
productName: Matane
copyright: Copyright © 2026 SukunDev
directories:
  output: release/${version}
  buildResources: resources
files:
  - out/**
  # Migrations are read from the app folder at start (inside the asar).
  - drizzle/**
  - package.json
  - '!**/*.map'
# Native module: it cannot be loaded from inside the asar.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  # sharp loads its native addon and libvips from @img/sharp-<platform> packages (ADR 0024).
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
# No built-in extensions: sources come from repositories the user adds.
icon: resources/icon.png
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
linux:
  # AppImage updates itself; deb and rpm install under /opt (updates through the package manager);
  # tar.gz is what the AUR package (packaging/aur) repacks. ADR 0021.
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
    - target: rpm
      arch: x64
    - target: tar.gz
      arch: x64
  category: Graphics;Viewer
  executableName: matane
  # WM_CLASS matches the .desktop entry, so docks group the window with its launcher.
  syncDesktopName: true
  synopsis: Manga reader with a sandboxed extension system
  desktop:
    entry:
      Keywords: manga;manhwa;manhua;comic;webtoon;reader;
  maintainer: SukunDev <sukundev32@gmail.com>
  vendor: SukunDev
deb:
  # electron-builder's default dependencies, plus the tray's indicator library where there is one.
  recommends: [libappindicator3-1]
win:
  target:
    - target: nsis
      arch: x64
    # One exe, no installer; tells about updates only (PORTABLE_EXECUTABLE_DIR, ADR 0021).
    - target: portable
      arch: x64
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.books
  # No code signing for now (docs/BRAINSTORM.md §10): Gatekeeper steps are in the README.
  identity: null
publish:
  provider: github
  owner: SukunDev
  repo: matane
  # The release workflow creates the release as a draft and publishes it once every OS uploaded.
  releaseType: draft
