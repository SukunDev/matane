name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Also downloads Electron and rebuilds better-sqlite3 (postinstall).
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Plain Node: better-sqlite3 is an N-API module, the same binary loads in Node and Electron.
      - run: pnpm test
      # Ubuntu 24.04 runners restrict unprivileged user namespaces (AppArmor), which Chromium's
      # sandbox needs; without it every Electron start, even `electron --version`, aborts.
      - name: Allow user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # End-to-end: the built app against a fake local site (no network). Needs a display.
      - run: xvfb-run -a pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7
