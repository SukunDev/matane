name: Docs

# The documentation site (apps/docs, VitePress): built on pull requests that touch it, published
# to GitHub Pages from main (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths: [apps/docs/**, .github/workflows/docs.yml]
  pull_request:
    paths: [apps/docs/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "Last updated" dates come from git history
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Only the docs package: no Electron download or native rebuild.
      - run: pnpm install --frozen-lockfile --filter @manga-reader/docs
      - run: pnpm --filter @manga-reader/docs build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
