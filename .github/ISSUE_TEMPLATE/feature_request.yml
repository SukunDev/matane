name: Feature request
description: An idea to make Matane better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the situation, more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Matane help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or other apps that do this
