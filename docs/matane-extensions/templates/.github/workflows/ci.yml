name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      # Replays recorded fixtures when a contributor committed none: suites without fixtures are skipped.
      - run: pnpm test
      # Every extension must build into a repository exactly as Publish would (unsigned here).
      - run: pnpm repo:build:unsigned
      # A changed extension needs a higher version, or the app never offers the change.
      - run: node scripts/check-versions.mjs "$REPO_URL"
        env:
          REPO_URL: ${{ vars.REPO_URL }}
