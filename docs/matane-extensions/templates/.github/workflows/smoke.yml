name: Smoke test

# Once a day, every extension reads its real site (list → details → chapters → pages → first image).
# A broken one gets an issue (or a comment on its open issue) with the end of its log.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test every extension against its site
        id: smoke
        run: |
          failed=""
          for dir in extensions/*/; do
            id=$(basename "$dir")
            echo "::group::$id"
            if ! pnpm exec mr-ext test "$dir" 2>&1 | tee "smoke-$id.log"; then failed="$failed $id"; fi
            echo "::endgroup::"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
        shell: bash -o pipefail {0}
      - name: Report broken extensions
        if: steps.smoke.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.smoke.outputs.failed }}
        run: |
          for id in $FAILED; do
            title="Smoke test failing: $id"
            body=$(printf 'The daily smoke test of `%s` failed on %s ([run](%s)).\n\n```\n%s\n```\n' \
              "$id" "$(date -u +%F)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "$(tail -n 60 "smoke-$id.log")")
            number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done
          exit 1
